server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tims-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/tims_db}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  mail:
    # Fallback SMTP (optional; SendGrid API used primarily)
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:changeme-please-use-a-long-random-secret-key-of-at-least-64-characters-for-hs512}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: ${SEED_ENABLED:true}
  email:
    provider: ${EMAIL_PROVIDER:sendgrid}          # sendgrid | log
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-address: ${MAIL_FROM:no-reply@tims.local}
    from-name: ${MAIL_FROM_NAME:TIMS}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.institute.tims: DEBUG
    org.springframework.security: INFO
